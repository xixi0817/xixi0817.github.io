<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinema 4D Animation | Xixi (Cecilia) Lin</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="description" content="Three short animations made in Cinema 4D and Adobe After Effects by Xixi (Cecilia) Lin.">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #1a1a1a;
      --ink: #111111;
      --muted: #6b6b6b;
      --line: #e6e1d6;
      --bg: #ffffff;
      --soft: #f4f1ea;
      --accent: #c9a46a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "DM Sans", sans-serif; color: var(--text); background: var(--bg); line-height: 1.7; font-size: 16px; }
    a { color: var(--ink); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    .wide { max-width: 1040px; }
    nav { position: sticky; top: 0; z-index: 10; background: var(--soft); box-shadow: 0 1px 0 rgba(0,0,0,0.08); }
    nav .wrap { max-width: 1040px; display: flex; justify-content: space-between; align-items: center; height: 60px; }
    nav .name { font-family: "DM Serif Display", serif; color: var(--ink); text-decoration: none; font-size: 18px; }
    nav .back { color: var(--ink); text-decoration: none; font-size: 15px; }
    nav .back:hover { color: #555; }
    .intro { padding: 56px 0 36px; }
    .kicker { color: #9a7a3f; letter-spacing: 3px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
    h1 { font-family: "DM Serif Display", serif; font-weight: 400; font-size: 42px; line-height: 1.15; color: var(--ink); margin: 12px 0 14px; }
    .lead { font-size: 18px; color: #333; }
    .meta { margin-top: 16px; color: var(--muted); font-size: 14px; }
    section { padding: 44px 0; border-top: 1px solid var(--line); }
    h2 { font-family: "DM Serif Display", serif; font-weight: 400; font-size: 26px; color: var(--ink); margin-bottom: 18px; }
    figure { margin: 0; }
    figure img { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--line); }
    .hero { margin-bottom: 44px; }
    .hero img { box-shadow: 0 12px 36px rgba(0,0,0,0.08); }
    .grid { display: grid; gap: 16px; }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .illus { max-width: 820px; margin: 0 auto; }
    footer { background: var(--soft); color: var(--muted); padding: 36px 0 48px; font-size: 14px; }
    footer .wrap { max-width: 1040px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    footer a { color: var(--ink); }
    @media (max-width: 743px) {
      h1 { font-size: 32px; }
      .lead { font-size: 16px; }
      nav .name { font-size: 16px; }
      .grid.three, .grid.two { grid-template-columns: 1fr; }
    }
    .videos { display: grid; gap: 28px; }
    .videos video { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: contain; display: block; background: #000; border-radius: 10px; }
  </style>
</head>
<body>
  <nav>
    <div class="wrap">
      <a class="name" href="index.html">Xixi (Cecilia) Lin</a>
      <a class="back" href="index.html#life">&larr; Back to Side Projects</a>
    </div>
  </nav>

  <main>
    <div class="intro">
      <div class="wrap">
        <div class="kicker">Side Project · 3D Animation</div>
        <h1>Cinema 4D Animation</h1>
        <p class="meta">Cinema 4D, Adobe After Effects &nbsp;|&nbsp; City College of New York</p>
      </div>
    </div>

    <div class="wrap wide" style="padding-bottom:48px">
      <div class="videos">
        <video src="images/side/cinema-4d/video1.mp4" poster="images/side/cinema-4d/poster1.jpg" controls playsinline preload="metadata"></video>
        <video src="images/side/cinema-4d/video2.mp4" poster="images/side/cinema-4d/poster2.jpg" controls playsinline preload="metadata"></video>
        <video src="images/side/cinema-4d/video3.mp4" poster="images/side/cinema-4d/poster3.jpg" controls playsinline preload="metadata"></video>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span>Xixi (Cecilia) Lin</span>
      <a href="index.html#life">&larr; Back to Side Projects</a>
    </div>
  </footer>
</body>
</html>
